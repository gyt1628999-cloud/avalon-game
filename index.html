<style>
:root { color-scheme: dark; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 20% 0%, #3a1838 0%, transparent 50%),
              radial-gradient(ellipse at 80% 100%, #4a2018 0%, transparent 55%),
              linear-gradient(180deg, #1f0e1d 0%, #1a0e15 100%);
  background-attachment: fixed;
  color: #f0e3c2;
  font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: #5a4838; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #c89838; }
/* 圆桌列的滚动条更细更隐蔽，避免和实录边界重叠突兀 */
.play-col-table::-webkit-scrollbar { width: 4px; }
.play-col-table::-webkit-scrollbar-track { background: transparent; }
.play-col-table::-webkit-scrollbar-thumb { background: rgba(90,72,56,0.5); border-radius: 2px; }
.play-col-table::-webkit-scrollbar-thumb:hover { background: rgba(200,152,56,0.6); }
.play-col-table { scrollbar-width: thin; scrollbar-color: rgba(90,72,56,0.5) transparent; padding-right: 6px; }

/* 录音脉动效果 */
@keyframes pulse-rec {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,72,56,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(200,72,56,0); }
}

/* === 阿瓦隆故事侧边栏（电脑端，绝对定位贴在 Setup 容器外侧） === */
.story-side {
  position: absolute;
  top: 80px;
  width: 250px;
  padding: 22px 20px;
  background:
    radial-gradient(ellipse at top, rgba(230,180,80,0.06) 0%, transparent 70%),
    linear-gradient(135deg, rgba(26,14,26,0.7) 0%, rgba(42,20,40,0.5) 100%);
  border: 1px solid rgba(230,180,80,0.22);
  border-radius: 4px;
  font-family: "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  pointer-events: none;
  box-shadow:
    0 4px 30px rgba(0,0,0,0.5),
    inset 0 0 50px rgba(230,180,80,0.05),
    inset 0 0 8px rgba(0,0,0,0.4);
}
.story-side::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(230,180,80,0.1);
  border-radius: 2px;
  pointer-events: none;
}
/* 顶部和底部装饰花纹 */
.story-side::after {
  content: "❦";
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(230,180,80,0.3);
  font-size: 14px;
}
.story-side-left {
  right: calc(100% + 32px);
}
.story-side-right {
  left: calc(100% + 32px);
}
.story-side-deco {
  text-align: center;
  font-size: 28px;
  color: rgba(230,180,80,0.55);
  margin-bottom: 4px;
  text-shadow:
    0 0 18px rgba(230,180,80,0.5),
    0 0 6px rgba(230,180,80,0.3);
}
.story-side-title {
  text-align: center;
  color: #d8843c;
  font-size: 11.5px;
  letter-spacing: 0.55em;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(230,180,80,0.22);
  font-weight: 500;
}
.story-side p {
  color: rgba(232,216,168,0.85);
  font-size: 13px;
  line-height: 2.05;
  margin-bottom: 11px;
  text-align: justify;
  letter-spacing: 0.04em;
  font-style: italic;
  text-indent: 0;
}
.story-side p strong {
  font-weight: 600;
  font-style: italic;
  color: rgba(230,180,80,0.98);
  text-shadow: 0 0 8px rgba(230,180,80,0.4);
  opacity: 1;
}
.story-side p em {
  font-style: italic;
  color: rgba(230,180,80,0.95);
  letter-spacing: 0.08em;
  text-shadow: 0 0 6px rgba(230,180,80,0.3);
}
.story-drop-cap {
  float: left;
  font-size: 32px;
  line-height: 1;
  padding: 3px 6px 0 0;
  color: #e6b450;
  font-family: "Cormorant Garamond", "Source Han Serif SC", "Songti SC", serif;
  font-weight: 600;
  font-style: normal !important;
  text-shadow:
    0 0 16px rgba(230,180,80,0.6),
    0 0 4px rgba(230,180,80,0.4);
}
.story-side-quote {
  margin-top: 16px;
  padding: 12px 4px;
  text-align: center;
  color: #e6b450;
  font-size: 11px;
  line-height: 2.2;
  letter-spacing: 0.25em;
  border-top: 1px solid rgba(230,180,80,0.25);
  border-bottom: 1px solid rgba(230,180,80,0.25);
  font-style: italic;
  text-shadow: 0 0 8px rgba(230,180,80,0.3);
}

/* 屏幕窄到放不下侧栏（≤ 1200px）就隐藏 */
@media (max-width: 1200px) {
  .story-side {
    display: none !important;
  }
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.4s ease-out both; }
@keyframes pulse-soft { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
.pulse-soft { animation: pulse-soft 1.6s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { box-shadow: 0 0 16px rgba(230, 180, 80, 0.3); }
  50%      { box-shadow: 0 0 28px rgba(230, 180, 80, 0.6); }
}
.glow { animation: glow 2.4s ease-in-out infinite; }
.team-tag {
  background: rgba(230,180,80,0.22);
  border: 1px solid rgba(230,180,80,0.7);
  color: #ffd870;
  padding: 1px 6px;
  border-radius: 4px;
  margin: 0 2px;
  font-weight: 600;
  display: inline-block;
}
@keyframes blink-cursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.cursor::after {
  content: "▍"; color: #e6b450; margin-left: 2px;
  animation: blink-cursor 0.8s step-end infinite;
}
#boot {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; color: #c89838; z-index: 100;
}
#boot.hidden { display: none; }
.spinner {
  width: 36px; height: 36px;
  border: 2px solid #5a4838; border-top-color: #e6b450; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* 实录区：发言正文字号加大（电脑端），不影响容器尺寸 */
.scene-log .speech-text {
  font-size: 16.5px;
  line-height: 1.75;
}
@media (max-width: 768px) {
  .scene-log .speech-text {
    font-size: 14.5px;
    line-height: 1.7;
  }
}

/* 手机端 tab 栏（默认隐藏） */
.mobile-tab-bar {
  display: none;
}

/* ============ 手机端响应式（≤ 768px）============ */
@media (max-width: 768px) {
  /* === 主对局区布局 === */
  .play-main-grid {
    grid-template-columns: 1fr !important;
    overflow-y: auto !important;
    padding: 8px !important;
    gap: 8px !important;
  }
  .mobile-hide { display: none !important; }

  /* === 顶部状态栏紧凑化 === */
  .top-bar-inner {
    flex-wrap: wrap !important;
    gap: 4px !important;
    padding: 6px 8px !important;
  }
  .top-bar-title {
    font-size: 13px !important;
    letter-spacing: 0.05em !important;
  }
  .top-bar-subtitle {
    font-size: 8.5px !important;
    letter-spacing: 0.18em !important;
  }
  .mission-track {
    transform: scale(0.78);
    transform-origin: right center;
    margin-right: -8px;
  }

  /* === 底部 tab 栏 === */
  .mobile-tab-bar {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20, 10, 18, 0.97);
    border-top: 1px solid rgba(230, 180, 80, 0.4);
    z-index: 50;
    backdrop-filter: blur(10px);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.4);
    padding-bottom: env(safe-area-inset-bottom, 0); /* iPhone 底部安全区 */
  }
  .mobile-tab-bar button {
    flex: 1;
    padding: 10px 6px;
    background: transparent;
    border: none;
    color: #a8a058;
    font-size: 13.5px;
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: all 0.2s;
    border-top: 2px solid transparent;
    min-height: 44px;
  }
  .mobile-tab-bar button.active {
    color: #e6b450;
    background: rgba(230, 180, 80, 0.1);
    border-top-color: #e6b450;
  }

  /* === 圆桌列：不单独滚动，跟外层一起滚 === */
  .play-col-table {
    overflow-y: visible !important;
    gap: 10px !important;
  }
  /* 手机端底部占位（iPhone 滚动回弹时也能保持笔记可见） */
  .mobile-bottom-spacer {
    height: 200px !important;
  }
  /* 圆桌本体在手机上缩小一点 */
  .round-table-wrapper {
    transform: scale(0.92);
    transform-origin: top center;
    margin-bottom: -16px;
  }

  /* === 实录列 === */
  .play-col-scene {
    height: calc(100vh - 130px) !important;
    padding-bottom: 80px !important;
  }
  .scene-log {
    max-height: none !important;
    padding: 10px !important;
  }
  .scene-log .speech-text {
    font-size: 14.5px;
    line-height: 1.7;
  }

  /* === 操作面板紧凑 === */
  .action-panel {
    padding: 10px !important;
  }

  /* === 弹窗（规则/历史详情/AI 设置等） === */
  .modal-panel {
    max-width: 95vw !important;
    max-height: 92vh !important;
    padding: 14px !important;
  }

  /* === 按钮触摸区 === */
  button {
    min-height: 38px;
  }

  /* === 开始页 === */
  .setup-title-main { font-size: 44px !important; }
  .setup-page { padding: 14px !important; }
  .grid-cols-6.player-count-grid {
    grid-template-columns: repeat(3, 1fr) !important;
  }

  /* === 复盘字号 === */
  .recap-text { font-size: 13px !important; }

  /* === 规则/教程按钮：手机端变圆形图标避免遮挡标题 === */
  .rules-btn-fixed,
  .tutorial-btn-fixed {
    top: 8px !important;
    padding: 0 !important;
    width: 38px !important;
    height: 38px !important;
    border-radius: 50% !important;
    font-size: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    letter-spacing: 0 !important;
  }
  .rules-btn-fixed {
    left: 8px !important;
    right: auto !important;
  }
  .tutorial-btn-fixed {
    right: 8px !important;
  }
  .rules-btn-fixed::before {
    content: "📖";
    font-size: 17px !important;
  }
  .tutorial-btn-fixed::before {
    content: "❓";
    font-size: 17px !important;
  }
  /* 给 Setup 顶部加 padding 避免标题被按钮遮挡 */
  .setup-page {
    padding-top: 56px !important;
  }
}

/* ============ 超小屏（iPhone SE 等，≤ 380px） ============ */
@media (max-width: 380px) {
  .setup-title-main { font-size: 36px !important; }
  .setup-page { padding: 12px !important; }
  .top-bar-title { font-size: 12px !important; }
  .top-bar-subtitle { font-size: 8px !important; }
  .mission-track {
    transform: scale(0.7);
  }
  .scene-log .speech-text {
    font-size: 13.5px !important;
    line-height: 1.65 !important;
  }
  .round-table-wrapper {
    transform: scale(0.85);
  }
  .mobile-tab-bar button {
    font-size: 12.5px;
    letter-spacing: 0.12em;
  }
  /* 笔记输入框收缩 */
  .grid-cols-6.player-count-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

function aiProposeTeam(leader, game) {
  const teamSize = game.setup.missions[game.round];
  const isEvil = ROLE_DEFS[leader.role].side === "evil";
  const allIds = game.players.map(p => p.id);
  // 队长上车是常态：蓝方队长保自己 100% 干净，红方队长保 bom 机会
  const includeSelf = Math.random() < 0.95;
  if (isEvil) {
    const evilTeam = leader.knowledge.sees.map(s => s.id);
    const team = includeSelf ? [leader.id] : [];
    // 第 1 轮 2 人队：绝不带认识的红方搭子（怕双 bom 暴露）
    // 但是奥伯伦不在 sees 里，所以"误带奥伯伦"还是可能发生（这是合理的）
    const isFirstRoundTwoPersonTeam = game.round === 0 && teamSize === 2;
    if (!isFirstRoundTwoPersonTeam) {
      const aggr = 0.4 + game.round * 0.15;
      if (Math.random() < aggr && evilTeam.length > 0) {
        const e = pick(evilTeam);
        if (!team.includes(e)) team.push(e);
      }
    }
    // 第 1 轮 2 人队红方队长：从"认识的搭子之外的人"里随机选
    // —— 这样也可能误选到奥伯伦（这是合理的双 bom 场景）
    while (team.length < teamSize) {
      const candidates = allIds.filter(id => !team.includes(id) && !evilTeam.includes(id));
      const pool = candidates.length > 0 ? candidates : allIds.filter(id => !team.includes(id));
      team.push(pick(pool));
    }
    return team;
  } else {
    const trust = computeTrust(leader, game);
    const sorted = allIds.filter(id => id !== leader.id).sort((a, b) => trust[b] - trust[a]);
    return includeSelf ? [leader.id, ...sorted.slice(0, teamSize - 1)] : sorted.slice(0, teamSize);
  }
}
function computeTrust(viewer, game) {
  const s = {};
  game.players.forEach(p => s[p.id] = 0);
  if (viewer.knowledge?.sees?.length) {
    if (viewer.role === "Merlin" || ROLE_DEFS[viewer.role].side === "evil") viewer.knowledge.sees.forEach(x => s[x.id] -= 100);
    if (viewer.role === "Percival") viewer.knowledge.sees.forEach(x => s[x.id] -= 5);
  }
  game.missionResults.forEach(m => {
    if (m.fails > 0) m.team.forEach(id => s[id] -= 10 * m.fails);else m.team.forEach(id => s[id] += 5);
  });
  // 🆕 已经被硬推理"全员红方"暴露的玩家——拉到底（无论是谁都不会带他们）
  game.missionResults.forEach(m => {
    // 全员暴露：失败票 = 队伍人数
    if (!m.success && m.fails === m.team.length) {
      m.team.forEach(id => s[id] -= 1000); // 直接拉到地心
    }
    // 几乎全员暴露：失败票 = 队伍人数 - 1（队伍 ≥3 人）
    else if (!m.success && m.team.length > 2 && m.fails === m.team.length - 1) {
      m.team.forEach(id => s[id] -= 50); // 强烈不信任
    }
  });
  return s;
}

// 关键修复：自己在车上的话默认支持（除非车上其他人特别可疑）
function aiVote(player, team, game) {
  const stance = game.stances?.[player.id];

  // 🆕 自己在车上时——默认支持，但如果车上其他人非常可疑可以反对
  if (team.includes(player.id)) {
    // 蓝方好人：如果车上其他人有"已暴露红方"或"明确视野中的红方"，可以反对
    const isEvil = ROLE_DEFS[player.role].side === "evil";
    if (!isEvil) {
      const trust = computeTrust(player, game);
      const otherIds = team.filter(id => id !== player.id);
      // 看车上其他人的信任度——任何一个 < -50（暴露红方）或视野里的红方 → 反对
      const hasExposedEvil = otherIds.some(id => trust[id] <= -50);
      const hasKnownEvil = player.knowledge?.sees && (player.role === "Merlin" || player.role === "Percival") && otherIds.some(id => player.knowledge.sees.some(s => s.id === id && s.label !== "真假梅林"));

    return true;
  }

  // === 投票前反思（让 AI 听完所有人发言后重新评估）===
  // 保留原 stance 的主导权，但 25% 概率被"后面的人说得有道理"反转
  const reconsider = aiReconsiderVote(player, team, game, stance);
  if (reconsider !== null) {
    // 🆕 #49 记录反转：AI 发言时表态 X，投票时反转 → 下轮发言要解释
    if (!game.voteFlips) game.voteFlips = {};
    game.voteFlips[player.id] = {
      round: game.round,
      voteRound: game.voteRound,
      stanceWasYes: stance === "yes",
      finalVote: reconsider,
      // 找出"是哪些后面的发言"让自己改变想法（取最近的反对/支持发言摘要）
      reasonHint: extractFlipReason(player, game, stance)
    };
    return reconsider;
  }
  if (stance === "yes") return true;
  if (stance === "no") return false;
  const isEvil = ROLE_DEFS[player.role].side === "evil";
  if (player.role === "Oberon") return Math.random() < 0.4;
  const evilOnTeam = team.filter(id => ROLE_DEFS[game.players[id].role].side === "evil").length;
  if (isEvil) {
    if (evilOnTeam >= 1) return Math.random() < 0.75;
    return Math.random() < 0.3;
  } else {
    const trust = computeTrust(player, game);
    const tt = team.reduce((s, id) => s + trust[id], 0);
    if (tt < -20) return Math.random() < 0.15;
    if (tt < 0) return Math.random() < 0.45;
    return Math.random() < 0.85;
  }
}

// 🆕 找出"是哪个后面的玩家说的什么话让自己改变想法"
function extractFlipReason(player, game, originalStance) {
  const myLabel = player.seatLabel;
  let myIdx = -1;
  for (let i = game.history.length - 1; i >= 0; i--) {
    if (game.history[i].tag === myLabel && !game.history[i].typing) {
      myIdx = i;
      break;
    }
  }
  if (myIdx < 0) return null;
  const laterSpeeches = game.history.slice(myIdx + 1).filter(h => /^\d+号$/.test(h.tag) && h.text && !h.typing);
  // 找出最关键的反向发言（用相同关键词检测）
  for (const h of laterSpeeches) {
    const t = h.text;
    const supports = /我支持|赞成|跟一把|放心|信任|跟车|没问题|过吧|让车跑/.test(t);
    const opposes = /反对|不放心|怀疑|有问题|不能上|这队不行|否决|流局/.test(t);
    if (originalStance === "yes" && opposes || originalStance === "no" && supports) {
      return {
        speaker: h.tag,
        snippet: t.slice(0, 50)
      };
    }
  }
  return null;
}

// 投票前反思：根据后续玩家发言改变想法（有限概率）
function aiReconsiderVote(player, team, game, stance) {
  // 没有原 stance（中性）就不反转

  // 找出当前玩家发言后面的发言（这些是 TA 没参考过的新信息）
  const myLabel = player.seatLabel;
  let myIdx = -1;

    const t = h.text;

    const opposes = /反对|不放心|怀疑|有问题|不能上|这队不行|否决|流局/.test(t);
    if (stance === "yes" && opposes) oppositeWeight += 1;
    if (stance === "no" && supports) oppositeWeight += 1;
  });

  // 后面有 ≥2 个声音跟你立场反着，就 30% 概率反转

  }
  // 后面有 ≥3 个声音反着，就 50% 概率反转（很多人不同意你）
  if (oppositeWeight >= 3 && Math.random() < 0.5) {
    return stance === "yes" ? false : true;
  }
  return null; // 不反转，保持原 stance
}

    if (evilOnTeam >= 2) {

function speakOrder(N, startId, dir) {
  const order = [];
  const step = dir === "cw" ? 1 : -1;
  for (let i = 0; i < N; i++) order.push((startId + i * step + N * N) % N);
  return order;
}
function aiPickDir(leader, game) {
  const cw = (leader.id + 1) % game.playerCount;
  const ccw = (leader.id - 1 + game.playerCount) % game.playerCount;
  const trust = computeTrust(leader, game);
  return trust[cw] >= trust[ccw] ? "cw" : "ccw";
}

// 🆕 #76 简单的请求并发控制——避免短时间内大量请求触发 rate limit
// 同一时刻最多 N 个并发请求，超过就排队
const __apiQueue = {
  active: 0,
  max: 3,
  queue: []
};
async function __apiAcquire() {
  if (__apiQueue.active < __apiQueue.max) {
    __apiQueue.active += 1;
    return;
  }
  // 排队
  await new Promise(resolve => __apiQueue.queue.push(resolve));
  __apiQueue.active += 1;
}
function __apiRelease() {
  __apiQueue.active -= 1;
  const next = __apiQueue.queue.shift();
  if (next) next();
}
async function callDeepSeek(messages, maxTokens = 400, opts = {}) {
  await __apiAcquire();
  try {
    const provider = getProvider();
    const cfg = PROVIDERS[provider];
    const key = getKeyFor(provider);
    if (!key) throw new Error("NO_KEY");
    // 如果调用方指定了 model 但当前 provider 不支持，回退到当前 provider 默认模型
    let model = opts.model || getDSModel();
    if (opts.model && !cfg.models.find(m => m.id === opts.model)) {
      // 调用方要求"chat 模型"——找当前 provider 第一个 model 当默认
      model = cfg.models[0].id;
    }
    // 不同 provider 的最优参数（调教过的）
    const PROVIDER_PARAMS = {
      deepseek: {
        temperature: 0.95,
        top_p: 0.95,
        frequency_penalty: 0.3,
        presence_penalty: 0.3
      },
      qianfan: {
        temperature: 0.85,
        top_p: 0.85,
        frequency_penalty: 0.5,
        presence_penalty: 0.4
      },
      // 百度系容易重复，加大惩罚
      kimi: {
        temperature: 0.9,
        top_p: 0.9,
        frequency_penalty: 0.4,
        presence_penalty: 0.4
      },
      // Kimi 长篇大论倾向，调低
      zhipu: {
        temperature: 0.95,
        top_p: 0.95,
        frequency_penalty: 0.2,
        presence_penalty: 0.3
      } // 智谱 GLM 倾向写得短——调高 temp 和降低 frequency_penalty 鼓励多说
    };
    const baseParams = PROVIDER_PARAMS[provider] || PROVIDER_PARAMS.deepseek;
    // 🆕 轻量模型容易被截断——给它们更大的 max_tokens
    const isLight = provider === "zhipu" || provider === "qianfan" || provider === "kimi";
    const finalMaxTokens = isLight ? Math.max(maxTokens, 600) : maxTokens;
    const body = {
      model,
      messages,
      max_tokens: finalMaxTokens,
      temperature: opts.temperature !== undefined ? opts.temperature : baseParams.temperature,
      top_p: opts.top_p !== undefined ? opts.top_p : baseParams.top_p,
      frequency_penalty: baseParams.frequency_penalty,
      presence_penalty: baseParams.presence_penalty
    };
    const resp = await fetch(cfg.url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${key}`
      },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`${cfg.label} ${resp.status}: ${errText.slice(0, 200)}`);
    }
    const data = await resp.json();
    const text = data?.choices?.[0]?.message?.content || "";
    return text.trim();
  } finally {
    __apiRelease();
  }
}

  // 🆕 #34 红方互相试探：如果场上有奥伯伦 + 我是其他红方（不是奥伯伦本身、且不是好人）
  // 我虽然看不到奥伯伦是谁，但我知道场上有这个角色——给我提示如何识别
  const hasOberonInGame = game.players.some(p => p.role === "Oberon");
  const speakerIsEvilButNotOberon = ROLE_DEFS[speaker.role].side === "evil" && speaker.role !== "Oberon";
  if (hasOberonInGame && speakerIsEvilButNotOberon) {
    knownInfo += `\n\n🤝 **关于奥伯伦的认知（红方共识）**：本局红方阵营里有【奥伯伦】角色——他不认识你（也不认识其他任何红方），你也看不到他。但**他客观上是你的同伴**，他会 bom 任务。
   • **识别奥伯伦的信号**：某个看似"好人"的玩家有这些特征中的多个 = 大概率奥伯伦
     - 上了车之后 bom 了（不在你认识的搭子里）
     - 反对了一个明显干净的好人（队伍里全是蓝方但他还反对）
     - 发言风格不像普通好人推理，更像"在装"
     - 队长选他时他主动支持上车
   • **如何配合**（在不暴露自己的前提下）：
     - 如果你怀疑某号是奥伯伦，**别戳穿**他——让他继续装好人
     - 如果你和疑似奥伯伦同时在车上，你**可以让他 bom 你装好人**（避免双 bom 暴露你）
     - **绝不能公开说"X 号是奥伯伦"或"奥伯伦在场"**——那是把奥伯伦的烟雾弹给烧了`;
  }

  // 🆕 #34 奥伯伦自己：如何让红方搭子认出你（不暴露给好人）
  if (speaker.role === "Oberon") {
    knownInfo += `\n\n🎭 **奥伯伦的发信号策略（让搭子认出你而不暴露给好人）**：
   • 你发言时用**普通好人逻辑**，但偶尔故意对一个"看起来干净"的人**轻微反对**——这是给搭子的信号
   • 但**绝不能太明显**！比如不要直接说"我反对 X 号"，而是"X 号那波我有点不放心"——好人觉得是你在凭直觉，搭子能看出你在搞事
   • 如果你 bom 了车，搭子下轮会推断"那车上有奥伯伦"——他会潜在保护你（不带你上车避免暴露）
   • 你**永远不要直接表态"我和某号一伙"**——搭子的认知是间接的`;
  }
  // 本局规则提示（双失败局）
  const doubleRule = game.setup.doubleFail && game.setup.doubleFail.length > 0 ? `\n📋 本局规则提示：第 ${game.setup.doubleFail.map(i => i + 1).join("、")} 轮是【双失败任务】——必须 2 张失败票才算失败！这意味着：(1) 这轮红方上 1 个无法直接 bom 掉任务；(2) 如果该轮出了 1 张失败票但任务成功，说明队里有红方但只有 1 个；(3) 如果该轮失败了，说明队里至少有 2 个红方。` : "";
  let missionsInfo = "尚未完成任何任务（**第 1 轮，所有人都没上过车，没人有'上车记录'可挖**——别拿'某号没上过车'当怀疑点）" + doubleRule;
  if (game.missionResults.length > 0) {
    missionsInfo = game.missionResults.map((m, i) => `第${i + 1}轮${game.setup.doubleFail && game.setup.doubleFail.includes(i) ? "（双失败局，需 2 失败票才算败）" : ""}：${m.success ? "✓成功" : "✗失败"}（${m.fails}张失败票），队员【${m.team.map(id => game.players[id].seatLabel).join("、")}】`).join("；") + doubleRule;
    // 精确每人上车记录（避免 AI 数错）
    const stats = {};
    game.players.forEach(p => {
      stats[p.id] = {
        ok: 0,
        fail: 0
      };
    });
    game.missionResults.forEach(m => {
      m.team.forEach(id => {
        if (m.success) stats[id].ok += 1;else stats[id].fail += 1;
      });
    });
    const statsLines = game.players.map(p => {
      const s = stats[p.id];
      const total = s.ok + s.fail;
      if (total === 0) return `${p.seatLabel}：从未上过车`;
      return `${p.seatLabel}：上过${total}次（成功${s.ok}次，失败${s.fail}次）`;
    }).join("；");
    missionsInfo += `\n【精确上车统计（请基于这个数据，不要瞎数）】${statsLines}`;

    // === 硬推理结论：根据任务结果直接算出已确定的红方 ===
    const hardConclusions = [];

    // 收集所有出现在成功任务里的人——这些人是"相对干净"的
    const cleanTracker = {}; // playerId -> {success: count, total: count}
    game.missionResults.forEach(m => {
      m.team.forEach(id => {
        if (!cleanTracker[id]) cleanTracker[id] = {
          success: 0,
          total: 0
        };
        cleanTracker[id].total += 1;
        if (m.success) cleanTracker[id].success += 1;
      });
    });
    game.missionResults.forEach((m, i) => {
      const teamLabels = m.team.map(id => game.players[id].seatLabel);
      const isDoubleFailRound = game.setup.doubleFail && game.setup.doubleFail.includes(i);

      // 双失败局：1 失败票任务还是成功 —— 这种情况是关键信息！
      if (isDoubleFailRound && m.success && m.fails === 1) {
        hardConclusions.push(`🟣 第${i + 1}轮（双失败特殊局）：队伍【${teamLabels.join("、")}】出了 1 张失败票但任务成功——**说明队里至少有 1 个红方**。`);
      }
      // 失败票 = 队员人数：整队全员暴露
      else if (!m.success && m.fails === m.team.length) {
        hardConclusions.push(`🔴 第${i + 1}轮失败票数(${m.fails})=队伍人数(${m.team.length})：队伍【${teamLabels.join("、")}】**全员都是红方**（这是确定的，不需要推理）`);
      }
      // 失败票 = 队员人数 - 1：除了一人都是红方
      else if (!m.success && m.fails === m.team.length - 1 && m.team.length > 2) {
        hardConclusions.push(`🟡 第${i + 1}轮失败票数(${m.fails})=队伍人数-1：队伍【${teamLabels.join("、")}】里**只有 1 人是蓝方**，其余 ${m.fails} 人都是红方`);
      }
      // 🆕 2 人队 + 1 失败票：核心博弈点
      else if (!m.success && m.fails === 1 && m.team.length === 2) {
        hardConclusions.push(`🔵 第${i + 1}轮关键 2 人队【${teamLabels.join("、")}】出了 1 张失败票——**至少 1 个红方**（也可能 2 个都红，因为红方有时会故意投成功伪装）。
  ⚠️ **关键博弈**：这 2 人里的**好人 100% 知道对方是红方**（因为自己投的成功，失败票必是对方）；这 2 人里的**红方为了自保也必须装好人 + 反指对方**。
  ⚠️ 所以正确做法：**这 2 人必须互相指认是红方**（一个真指、一个装着指）。如果他俩互相维护、说"对方应该是好人"——**至少有 1 个在演戏，大概率两个都是红方**！这是阿瓦隆识破红方搭子的关键点。`);
      }
      // 🆕 3 人队 2 失败：至少 2 红
      else if (!m.success && m.fails === 2 && m.team.length === 3) {
        hardConclusions.push(`🟠 第${i + 1}轮 3 人队【${teamLabels.join("、")}】出了 2 张失败票——**至少 2 个红方**（也可能 3 个都红）。这队里**最多只有 1 个蓝方**，要重点找出谁是那唯一的蓝方。`);
        // 🆕 自己视角：如果自己在这队 + 自己是好人 → 100% 知道另外 2 个都是红方
        if (m.team.includes(speaker.id) && ROLE_DEFS[speaker.role].side === "good") {
          const otherTwo = m.team.filter(id => id !== speaker.id).map(id => game.players[id].seatLabel);
          hardConclusions.push(`🔥 **你自己视角的硬结论**：你在第${i + 1}轮那个 3 人车上！你是好人（投了成功票），所以失败票全是另外 2 人投的——**【${otherTwo.join("、")}】两个都是红方**（100% 确定，不是"至少一个"，是两个都是）！发言时要**斩钉截铁地指认这两个人都是红方**，不能含糊说"他俩里有一个"——是两个都是！`);
        }
      }
      // 🆕 N 人队 N-1 失败 + 自己在队里 + 自己好人 → 其他全红
      else if (!m.success && m.fails === m.team.length - 1 && m.team.length >= 2 && m.team.includes(speaker.id) && ROLE_DEFS[speaker.role].side === "good") {
        const others = m.team.filter(id => id !== speaker.id).map(id => game.players[id].seatLabel);
        hardConclusions.push(`🔥 **你自己视角的硬结论**：你在第${i + 1}轮那个失败队上，失败票数=队伍人数-1——你是好人（投的成功），所以**【${others.join("、")}】全部都是红方**（100% 确定）！发言时要直接指认所有这些人都是红方。`);
      }
      // 🆕 4 人队 2 失败（非双失败局）：至少 2 红
      else if (!m.success && m.fails === 2 && m.team.length === 4 && !isDoubleFailRound) {
        hardConclusions.push(`🟠 第${i + 1}轮 4 人队【${teamLabels.join("、")}】出了 2 张失败票——**至少 2 个红方**（也可能 3-4 个都红）。`);
      }
      // 双失败局失败：至少 2 个红方
      else if (!m.success && isDoubleFailRound && m.fails >= 2) {
        hardConclusions.push(`🟠 第${i + 1}轮（双失败局）：队伍【${teamLabels.join("、")}】里**至少有 ${m.fails} 个红方**（这局需要 2 张失败票才算失败，所以红方至少 ${m.fails} 人潜伏其中）`);
      }
      // 普通失败：至少有 X 个红方在队里
      else if (!m.success && m.fails >= 1) {
        hardConclusions.push(`🟠 第${i + 1}轮：队伍【${teamLabels.join("、")}】里至少有 ${m.fails} 个红方（具体是谁需要结合后续推理）`);
      }
    });

    // 🆕 干净度推理：上过 ≥2 次成功任务的人是相对干净的
    const cleanPlayers = Object.entries(cleanTracker).filter(([id, stat]) => stat.success >= 2 && stat.total === stat.success).map(([id]) => game.players[id].seatLabel);
    if (cleanPlayers.length > 0) {
      hardConclusions.push(`✅ **相对干净的玩家**：${cleanPlayers.join("、")}——上过 ≥2 次成功任务且没失败过。这些人**大概率是蓝方**（红方上车通常会找机会 bom，连续不 bom 概率小）。可以**抢着把他们带上车**，或者**把他们当队长信任**。`);
    }

    // 🆕 #46 队长带过 + 任务成功 = 队长和被带的人之间有正向信任
    // 但这是"软信号"——不是硬结论，要小心使用
    const leaderTrustHints = [];
    game.missionResults.forEach((m, i) => {
      if (!m.success) return; // 只看成功的车
      const leaderId = m.leaderId;
      if (leaderId === undefined) return;
      const leader = game.players[leaderId];
      const otherIds = m.team.filter(id => id !== leaderId);
      if (otherIds.length === 0) return;
      const otherLabels = otherIds.map(id => game.players[id].seatLabel).join("、");
      leaderTrustHints.push(`第${i + 1}轮 ${leader.seatLabel} 当队长带【${otherLabels}】成功——${leader.seatLabel} 信任这些人`);
    });
    if (leaderTrustHints.length > 0) {
      hardConclusions.push(`💡 **队长信任轨迹（软信号）**：\n  ${leaderTrustHints.join("\n  ")}\n  ⚠️ 这只是参考——红方队长也可能"带搭子上车不 bom"做信誉。但**蓝方队长大概率信任他带的人**，可以反向推理蓝方阵营。`);
    }

    // 🆕 #82 队长重复使用某号（软信号：可能在保护同伴）
    // 比如某队长第 1 轮带 X 号、第 2 轮还带 X 号——可能在保护 X 号（同伴）
    const leaderRepeatPattern = {};
    game.missionResults.forEach((m, i) => {
      const leaderId = m.leaderId;
      if (leaderId === undefined) return;
      m.team.forEach(memberId => {
        if (memberId === leaderId) return;
        const key = `${leaderId}->${memberId}`;
        if (!leaderRepeatPattern[key]) leaderRepeatPattern[key] = [];
        leaderRepeatPattern[key].push({
          round: i,
          success: m.success
        });
      });
    });
    const repeatHints = [];
    Object.entries(leaderRepeatPattern).forEach(([key, history]) => {
      if (history.length >= 2) {
        const [leaderId, memberId] = key.split("->").map(Number);
        const lname = game.players[leaderId].seatLabel;
        const mname = game.players[memberId].seatLabel;
        const successCount = history.filter(h => h.success).length;
        const failCount = history.length - successCount;
        if (failCount >= 1) {
          repeatHints.push(`${lname} 多次（${history.length} 次）当队长都带 ${mname}，但其中 ${failCount} 次失败——${lname} 可能在保护 ${mname}（搭子嫌疑）`);
        }
      }
    });
    if (repeatHints.length > 0) {
      hardConclusions.push(`🔍 **队长重复使用模式（软信号）**：\n  ${repeatHints.join("\n  ")}\n  ⚠️ 不是 100% 必然——也可能队长真的就是信任 TA。但**多次带同一人去失败队 = 大概率搭子关系**。`);
    }

    // 🆕 #67 投票分布揭示阵营：少数派反对者大概率同伴
    // 如果一队最终成功通过了但只有 2-3 人反对，这 2-3 人有可能是红方搭子
    if (game.roundEvents) {
      const minorityOpposers = [];
      Object.values(game.roundEvents).forEach(roundList => {
        roundList.forEach(ev => {
          if (ev.type !== "approved" && ev.type !== "rejected") return;
          if (!ev.votes) return;
          const opposers = Object.entries(ev.votes).filter(([_, v]) => v === false).map(([id]) => parseInt(id));
          const totalVoters = Object.keys(ev.votes).length;
          // 少数反对（2-3 人反对，且 < 一半）
          if (opposers.length >= 2 && opposers.length <= 3 && opposers.length < totalVoters / 2) {
            const labels = opposers.map(id => game.players[id].seatLabel).join("、");
            minorityOpposers.push(`【${labels}】一起反对了某队`);
          }
        });
      });
      if (minorityOpposers.length >= 2) {
        // 只有反复出现"几个人一起反对"才有意义
        hardConclusions.push(`🔍 **少数派反对模式（软信号）**：${minorityOpposers.slice(0, 3).join("；")}——反复一起反对的几人**有较大可能是同伴**（红方都不希望蓝方车跑成功）。⚠️ 但这只是参考，不是 100%——蓝方好人也可能因为同样的怀疑投反对。`);
      }
    }

    // 🆕 #68 失败队 vs 成功队的反对一致性
    if (game.roundEvents) {
      const opposeFailRate = {}; // 反对失败队的次数 / 失败队总数
      const supportFailRate = {}; // 支持失败队的次数 / 失败队总数
      const successApprovedTeams = []; // 成功的车
      const failApprovedTeams = []; // 失败的车
      game.missionResults.forEach((m, i) => {
        // 找到这次任务的 approved 投票事件
        const roundEvts = game.roundEvents[i] || [];
        const approveEvt = roundEvts.find(ev => ev.type === "approved" && ev.votes);
        if (!approveEvt) return;
        const data = {
          votes: approveEvt.votes,
          success: m.success
        };
        if (m.success) successApprovedTeams.push(data);else failApprovedTeams.push(data);
      });
      if (failApprovedTeams.length >= 2) {
        // 谁反对了所有/大部分失败队？
        const playerStats = {};
        game.players.forEach(p => playerStats[p.id] = {
          opposedFailed: 0,
          supportedFailed: 0
        });
        failApprovedTeams.forEach(t => {
          Object.entries(t.votes).forEach(([pid, v]) => {
            if (v === false) playerStats[pid].opposedFailed += 1;else playerStats[pid].supportedFailed += 1;
          });
        });
        const sharpEyes = Object.entries(playerStats).filter(([_, s]) => s.opposedFailed >= failApprovedTeams.length - 0).map(([id]) => game.players[id].seatLabel);
        const blindEyes = Object.entries(playerStats).filter(([_, s]) => s.supportedFailed >= failApprovedTeams.length).map(([id]) => game.players[id].seatLabel);
        if (sharpEyes.length > 0) {
          hardConclusions.push(`🎯 **反对所有失败队的玩家（高视野信号）**：${sharpEyes.join("、")}——反对了全部 ${failApprovedTeams.length} 个失败队。**大概率有视野（梅林/派西）或推理特别准**——但也是刺客的盯人目标。`);
        }
        if (blindEyes.length > 0) {
          hardConclusions.push(`⚠️ **支持所有失败队的玩家（视野错乱信号）**：${blindEyes.join("、")}——支持了全部 ${failApprovedTeams.length} 个失败队。**大概率是红方在帮搭子推车** 或 **完全没视野的好人**。`);
        }
      }
    }

    // 🆕 交叉对比：同一人出现在不同结果的车里——可疑度推理
    const suspectScore = {};
    Object.entries(cleanTracker).forEach(([id, stat]) => {
      const failCount = stat.total - stat.success;
      if (failCount > 0) {
        suspectScore[id] = failCount * 2 - stat.success;
      }
    });
    const topSuspects = Object.entries(suspectScore).filter(([_, score]) => score > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => game.players[id].seatLabel);
    if (topSuspects.length > 0) {
      hardConclusions.push(`⚠️ **可疑度高的玩家**（失败队出现次数多）：${topSuspects.join("、")}——重点怀疑这些人。**对比成功队和失败队的差异**就能找出红方。`);
    }

    // 🆕 双队对比推理：同一人在两次任务都上车，但一成功一失败 → 找出关键变量
    // 例：第 1 轮【A、B】失败，第 2 轮【A、C】成功 → B 大概率红，C 大概率蓝
    const successfulMissions = game.missionResults.filter(m => m.success);
    const failedMissions = game.missionResults.filter(m => !m.success);
    const compareDiffs = [];
    failedMissions.forEach(failM => {
      successfulMissions.forEach(succM => {
        const failTeam = new Set(failM.team);
        const succTeam = new Set(succM.team);
        const sharedIds = [...failTeam].filter(id => succTeam.has(id));
        // 至少有 1 人共享 → 可以做对比推理
        if (sharedIds.length >= 1) {
          const onlyInFail = [...failTeam].filter(id => !succTeam.has(id));
          const onlyInSucc = [...succTeam].filter(id => !failTeam.has(id));
          if (onlyInFail.length > 0 && onlyInSucc.length > 0) {
            const sharedLabels = sharedIds.map(id => game.players[id].seatLabel).join("、");
            const failOnlyLabels = onlyInFail.map(id => game.players[id].seatLabel).join("、");
            const succOnlyLabels = onlyInSucc.map(id => game.players[id].seatLabel).join("、");
            const failR = game.missionResults.indexOf(failM) + 1;
            const succR = game.missionResults.indexOf(succM) + 1;
            compareDiffs.push(`🔍 **第${succR}轮 vs 第${failR}轮对比**：共同人【${sharedLabels}】参与了这两轮——**第${succR}轮成功**（仅 ${succR} 队多出【${succOnlyLabels}】），**第${failR}轮失败**（仅 ${failR} 队多出【${failOnlyLabels}】）。**结论**：【${succOnlyLabels}】大概率是蓝方，【${failOnlyLabels}】大概率有红方在内。`);
          }
        }
      });
    });
    // 最多列出 2 条最有用的对比
    if (compareDiffs.length > 0) {
      compareDiffs.slice(0, 2).forEach(line => hardConclusions.push(line));
    }
    if (hardConclusions.length > 0) {
      missionsInfo += `\n\n══════ 🚨 硬推理结论（基于失败票数学规律，不是猜测）══════\n${hardConclusions.join("\n")}\n══════════════════════════════════════════════════\n⚠️ 这些是**铁定**的事实，发言时要用上！比如"5 号 6 号第 1 轮 2 人队就出了 2 张失败票，他俩都是红的，没什么好说的，必须刺。"`;
    }
  }

  // === 投票历史（让 AI 准确说"谁投了反对"，附带轮次）===
  let voteHistory = "";

// 全局 API 失败标志（用于通知 UI）
let _apiFailCallback = null;
function setApiFailCallback(cb) {
  _apiFailCallback = cb;
}
function notifyApiFail(errMsg) {
  if (_apiFailCallback) _apiFailCallback(errMsg);
}
async function aiSpeak(speaker, game, situation, useAPI) {
  if (useAPI && getDSKey()) {
    try {
      return await aiSpeakViaAPI(speaker, game, situation);
    } catch (e) {
      console.warn("DeepSeek failed:", e.message);
      notifyApiFail(e.message); // 通知 UI
      const r = fallbackSpeech(speaker, game, situation);
      return {
        ...r,
        thinking: r.thinking || generateLocalThinking(speaker, game, situation, r.stance)
      };
    }
  }
  const r = fallbackSpeech(speaker, game, situation);
  return {
    ...r,
    thinking: r.thinking || generateLocalThinking(speaker, game, situation, r.stance)
  };
}

// 本地心理活动生成（API 不可用时兜底）
function generateLocalThinking(speaker, game, situation, stance) {
  const role = ROLE_DEFS[speaker.role];
  const side = role.side;
  const inTeam = (game.proposedTeam || []).includes(speaker.id);
  const knownEvil = speaker.knowledge.sees.filter(s => s.label === "邪恶同伴" || s.label === "邪恶方").map(s => game.players[s.id].seatLabel);
  const templates = {
    Merlin: [`我是梅林，看到红方是 ${knownEvil.join("、") || "..."}。这队${inTeam ? "有我" : "没我"}，得引导大家但不能太直接，刺客在盯着。`, `我看见 ${knownEvil.join("、")} 是红的，但绝对不能明说。用模糊措辞引导吧。`, `心里清楚谁是红的，但话不能太满，不然刺客一刀就来了。`],
    Percival: [`我看到 ${speaker.knowledge.sees.map(s => game.players[s.id].seatLabel).join("和")} 是真假梅林，但分不清谁真。看发言风格判断。`, `两个目标人物里有真梅林，得找出来保护，自己也可以装作梅林吸引火力。`],
    Loyal: [`我没视野，纯靠观察。这队人选我感觉${inTeam ? "我自己在还行" : "得想想"}。`, `没特殊身份，跟着信息走，先看看任务结果说话。`, `我就是普通好人，赌一把跟车。`],
    Morgana: [`我是莫甘娜，得装梅林骗派西。用"感觉不对"这种口吻指好人。`, `红方任务：让派西以为我是梅林，同时不要太明显。`, `这队${inTeam ? "我自己在，必须支持" : "如果有我同伴就支持"}，混过去。`],
    Assassin: [`我是刺客，要观察谁的发言最像梅林——后期一刀刺中就翻盘。`, `先装好人混着，记住每个人的发言风格，找出有视野的人。`, `心里盯着场上谁的判断最准，那个人很可能是梅林。`],
    Minion: [`我是普通爪牙，看到同伴是 ${knownEvil.join("、")}。装好人配合他们就行。`, `让任务失败 + 不暴露身份，就是我的全部任务。`],
    Oberon: [`我是奥伯伦，看不到同伴，自己也没视野，纯瞎装好人。`, `不知道谁是自己人，乱来吧，反正也只能赌了。`]
  };
  const list = templates[speaker.role] || templates.Loyal;
  return list[Math.floor(Math.random() * list.length)];

  async function runAIRevise() {

    const g = await new Promise(resolve => setGame(prev => {
      resolve({
        ...prev
      });
      return prev;
    }));
    // 看队长总结时的态度——如果队长说支持，就不重选；只有总结时态度模糊或反对才考虑重选
    const leaderStance = (g.stances || {})[leader.id];
    // 队长本人不在车上 + 总结里没明确支持 → 才有可能重选
    const leaderInTeam = (g.proposedTeam || []).includes(leader.id);
    let willRevise = false;
    if (!g.revoteUsed) {
      if (leaderStance === "no") willRevise = true; // 队长总结说反对 → 必重选
      else if (leaderStance === "yes") willRevise = false; // 总结说支持 → 不能重选
      else willRevise = !leaderInTeam && Math.random() < 0.1; // 中性时低概率重选
    }
    if (willRevise) {
      g.revoteUsed = true;
      g.stances = {};
      g.history = [...g.history, {
        tag: "重选",
        text: `${leader.seatLabel} 决定重新组队`
      }];
      const newTeam = aiProposeTeam(leader, g);
      g.proposedTeam = newTeam;
      g.history = [...g.history, {
        tag: "组队",
        text: `${leader.seatLabel} 重选：${newTeam.map(id => g.players[id].seatLabel).join("、")}`
      }];
    } else {
      g.history = [...g.history, {
        tag: "确认",
        text: `${leader.seatLabel} 维持原队伍`
      }];
    }

    setGame(g);
    setBusy(false);

  async function runVoting() {
    setBusy(true);
    await sleep(400);

    const g = await new Promise(resolve => setGame(prev => {

      });
      return prev;
    }));
    const votes = {};
    g.players.forEach(p => {
      if (!p.isHuman) votes[p.id] = aiVote(p, g.proposedTeam, g);
    });
    if (g.humanVote === undefined) {
      // auto 模式直接给出投票
      if (game.assistMode === "auto") {
        votes[human.id] = aiVote(human, g.proposedTeam, g);
        g.humanVote = votes[human.id];
      } else {
        g.phase = "humanVote";
        setGame(g);
        setBusy(false);
        return;
      }
    } else {
      votes[human.id] = g.humanVote;
    }
    const yes = Object.values(votes).filter(Boolean).length;
    const passed = yes > g.playerCount / 2;
    g.lastVoteDetail = {
      votes,
      yes,
      total: g.playerCount,
      passed,
      team: [...g.proposedTeam],
      leaderId: g.leaderId,
      voteRound: g.voteRound
    };
    g.history = [...g.history, {
      tag: "投票",
      text: `${passed ? "通过" : "流局"}（赞成 ${yes}/${g.playerCount}）`,
      voteDetail: g.lastVoteDetail
    }];

    // 记到 roundEvents
    recordSubround(g, passed ? "approved" : "rejected", {
      team: [...g.proposedTeam],
      votes: {
        ...votes
      },
      yes,
      leaderId: g.leaderId
    });
    g.humanVote = undefined;
    if (passed) {
      g.approvedTeam = g.proposedTeam;
      g.phase = "voteShown";
    } else {
      g.voteRound += 1;
      g.leaderId = (g.leaderId + 1) % g.playerCount;
      if (g.voteRound >= 5) {
